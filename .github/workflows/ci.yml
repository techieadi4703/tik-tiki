name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend TDD Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/api/go.sum

      - name: Run Tests with Coverage and Race Detector
        run: |
          cd services/api
          go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Minimum Coverage Threshold
        run: |
          cd services/api
          go tool cover -func=coverage.out
