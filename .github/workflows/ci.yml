name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Go TDD & Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: services/api/go.sum

      - name: Run Static Analysis (go vet)
        run: |
          cd services/api
          go vet ./...

      - name: Run Backend Tests
        run: |
          cd services/api
          go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Coverage
        run: |
          cd services/api
          go tool cover -func=coverage.out

  frontend-test:
    name: Frontend Client TDD Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Run Frontend Tests
        run: |
          cd apps/web
          node --test src/**/*.test.mjs
