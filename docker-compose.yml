version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tiktiki-postgres
    restart: always
    environment:
      POSTGRES_USER: tiktiki_admin
      POSTGRES_PASSWORD: local_secret_pass
      POSTGRES_DB: tiktiki_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiktiki_admin -d tiktiki_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: tiktiki-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: tiktiki-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://tiktiki_admin:local_secret_pass@postgres:5432/tiktiki_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
